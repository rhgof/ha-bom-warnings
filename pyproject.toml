[project]
name = "ha-bom-warnings"
version = "0.0.1"
requires-python = ">=3.13"

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-homeassistant-custom-component"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
